# Scheduled scoring pipeline: scrape PlayThru -> score -> publish to Sheets.
#
# This is the belt-and-suspenders path that keeps the Google Sheet fresh even
# if nobody has the app open. The Streamlit app also refreshes itself, so the
# system still works if this workflow is disabled.
#
# Setup:
# 1. Repo secret GCP_SERVICE_ACCOUNT_JSON = full service-account key JSON.
# 2. Set google_sheet_key in event_2026.json (a NEW sheet for 2026).
# 3. Enable the schedule below during event weekend (it is safe to leave on:
#    if the sheet key is empty the run only refreshes local artifacts).
#
# NOTE: GitHub cron has a ~5 minute floor and can be delayed under load.

name: Update golf scores

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

concurrency:
  group: score-update
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements_2026.txt

      - name: Run scoring pipeline
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: python -m jdcvo.pipeline --config event_2026.json
